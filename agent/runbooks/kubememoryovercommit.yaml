id: runbook-kubememoryovercommit-001
error_class: KubeMemoryOvercommit
service: kubernetes
severity: warning
commands:
  - kubectl top nodes
  - kubectl describe nodes | grep -A5 "Allocated resources"
  - kubectl get pods --all-namespaces -o custom-columns=NS:.metadata.namespace,POD:.metadata.name,MEM_REQ:.spec.containers[*].resources.requests.memory
text: |
  # KubeMemoryOvercommit — Cluster memory requests exceed capacity

  ## What is happening
  The total memory requested by all pods exceeds the cluster's allocatable
  memory. Unlike CPU (which is throttled), memory overcommit is dangerous:
  if pods actually use their requested memory, the OOM killer will start
  terminating containers.

  ## Common root causes
  - Too many pods for the cluster size.
  - Memory requests set too high (over-provisioned).
  - Memory-intensive workloads deployed without scaling the cluster.
  - Cluster autoscaler disabled or at max node count.
  - Pods without memory limits consuming more than requested.

  ## Investigation steps
  1. kubectl top nodes — see actual memory usage vs capacity.
  2. Check allocated resources per node: kubectl describe nodes | grep -A5 "Allocated resources"
  3. Identify the biggest memory consumers: kubectl top pods --all-namespaces --sort-by=memory
  4. Check for Pending pods: kubectl get pods --all-namespaces --field-selector=status.phase=Pending
  5. Check if any pods have been OOMKilled recently due to pressure.

  ## Remediation
  - Right-size memory requests based on actual usage (kubectl top pods).
  - Scale down non-essential deployments.
  - Add nodes to the cluster (increase node pool max count).
  - Set memory limits on all pods to prevent unbounded growth.
  - Memory overcommit is more dangerous than CPU — prioritize fixing this.
