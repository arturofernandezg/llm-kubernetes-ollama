# =============================================================================
# Prometheus standalone + kube-state-metrics
# Namespace: arturo-monitoring
#
# Decisión (tutor 2026-04-20): Prometheus mínimo, no kube-prometheus-stack.
# Nota: se usan ClusterRole/ClusterRoleBinding porque Prometheus necesita
# acceso de lectura a nodes y kubelet/cAdvisor (cluster-scoped por diseño).
# El tutor confirmó permisos de admin en la misma reunión.
#
# Apply:
#   kubectl apply -f k8s/prometheus.yaml
#   kubectl apply -f k8s/service-agent.yaml  # requiere las annotations nuevas
#
# Verificar:
#   kubectl get pods -n arturo-monitoring
#   kubectl port-forward svc/prometheus-svc 9090:9090 -n arturo-monitoring
#   # abrir http://localhost:9090/targets
#
# =============================================================================

# ── ServiceAccount Prometheus ─────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: arturo-monitoring

---

# ── ClusterRole: lectura de nodos, pods, services, endpoints ─────────────────
# ClusterRole necesario (no namespace-scoped) porque el scrape de
# kubelet/cAdvisor requiere list/watch de nodes y acceso a /api/v1/nodes/proxy.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-viewer
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-viewer
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: arturo-monitoring

---

# ── ServiceAccount kube-state-metrics ────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: arturo-monitoring

---

# ── ClusterRole: lectura de todos los recursos que KSM expone ────────────────

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-viewer
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - secrets
      - services
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [list, watch]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-viewer
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: arturo-monitoring

---

# ── ConfigMap: prometheus.yml ─────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: arturo-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 20s
      evaluation_interval: 30s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager-svc.arturo-monitoring.svc.cluster.local:9093"]

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Scrape de servicios anotados con prometheus.io/scrape=true
      # (agente FastAPI en arturo-llm-test, KSM en arturo-monitoring)
      - job_name: kubernetes-endpoints
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [arturo-llm-test, arturo-monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
        metric_relabel_configs:
          # KSM emite métricas con namespace/pod del pod monitorizado, pero
          # Prometheus los renombra a exported_* al colisionar con los target labels
          # (KSM corre en arturo-monitoring). Restauramos los valores reales aquí
          # para que las reglas de alerting y los joins con cAdvisor funcionen.
          - source_labels: [exported_namespace]
            regex: (.+)
            target_label: namespace
          - regex: exported_namespace
            action: labeldrop
          - source_labels: [exported_pod]
            regex: (.+)
            target_label: pod
          - regex: exported_pod
            action: labeldrop

      # Scrape de métricas de contenedor (CPU/memoria) via kubelet/cAdvisor
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

---

# ── ConfigMap: reglas de alerting (5 reglas del tutor) ───────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: arturo-monitoring
data:
  aiops-rules.yml: |
    groups:
      - name: aiops.alerts
        interval: 30s
        rules:

          # 1. OOMKilled — container terminado por el OOM killer del kernel
          - alert: KubePodOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 0m
            labels:
              severity: critical
              team: aiops
            annotations:
              summary: "Pod {{ $labels.pod }} killed by OOM"
              description: >
                Container {{ $labels.container }} in pod {{ $labels.pod }}
                (ns {{ $labels.namespace }}) was OOMKilled.
                Memory limit may be too low.

          # 2. CrashLoopBackOff — pod reiniciándose repetidamente (>3 en 15m)
          - alert: KubePodCrashLoopBackOff
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: critical
              team: aiops
            annotations:
              summary: "Pod {{ $labels.pod }} crash looping"
              description: >
                Container {{ $labels.container }} in pod {{ $labels.pod }}
                (ns {{ $labels.namespace }}) restarted {{ $value | printf "%.0f" }}
                times in the last 15 minutes.

          # 3. HighMemory — uso >90% del memory limit durante 5m
          - alert: HighMemory
            expr: >
              container_memory_working_set_bytes{container!=""}
                / on(namespace, pod, container)
              kube_pod_container_resource_limits{resource="memory"}
              > 0.9
            for: 5m
            labels:
              severity: warning
              team: aiops
            annotations:
              summary: "Container {{ $labels.container }} memory near limit"
              description: >
                Container {{ $labels.container }} in pod {{ $labels.pod }}
                (ns {{ $labels.namespace }}) uses
                {{ $value | humanizePercentage }} of its memory limit.

          # 4. HighCPU — uso >90% del CPU limit durante 5m
          - alert: HighCPU
            expr: >
              rate(container_cpu_usage_seconds_total{container!=""}[5m])
                / on(namespace, pod, container)
              kube_pod_container_resource_limits{resource="cpu"}
              > 0.9
            for: 5m
            labels:
              severity: warning
              team: aiops
            annotations:
              summary: "Container {{ $labels.container }} high CPU usage"
              description: >
                Container {{ $labels.container }} in pod {{ $labels.pod }}
                (ns {{ $labels.namespace }}) CPU at
                {{ $value | humanizePercentage }} of its limit.

          # 5. TargetDown — scrape target caído durante 2m
          - alert: TargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
              team: aiops
            annotations:
              summary: "Scrape target {{ $labels.job }} down"
              description: >
                Prometheus target {{ $labels.instance }} (job={{ $labels.job }})
                has been unreachable for 2 minutes.

          # 6. ImagePullBackOff — contenedor no puede pullar imagen (deploy defectuoso)
          - alert: KubePodImagePullBackOff
            expr: kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
            for: 1m
            labels:
              severity: critical
              team: aiops
            annotations:
              summary: "Pod {{ $labels.pod }} cannot pull image"
              description: >
                Container {{ $labels.container }} in pod {{ $labels.pod }}
                (ns {{ $labels.namespace }}) is in ImagePullBackOff for >1m.
                Likely cause: wrong image tag, missing registry auth, or unreachable registry.

---

# ── Deployment Prometheus ─────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: arturo-monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=2h"
            - "--web.listen-address=:9090"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: storage
          emptyDir: {}

---

# ── Service Prometheus ────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: arturo-monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP

---

# ── Deployment kube-state-metrics ─────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: arturo-monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: kube-state-metrics
          # Mirror a Artifact Registry porque los nodos spot no tienen Cloud NAT
          # → registry.k8s.io no es alcanzable. Mismo patrón que la imagen del agente.
          # imagePullPolicy: Always para forzar re-pull si se actualiza el mirror en AR.
          image: europe-southwest1-docker.pkg.dev/uniovi-ai-infra-agent/aiops-agent/kube-state-metrics:v2.13.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http-metrics
            - containerPort: 8081
              name: telemetry
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15

---

# ── Service kube-state-metrics ────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-svc
  namespace: arturo-monitoring
  labels:
    app: kube-state-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
    - name: telemetry
      port: 8081
      targetPort: 8081
  type: ClusterIP
