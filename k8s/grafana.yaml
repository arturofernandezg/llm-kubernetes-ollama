# ── ConfigMap: contact point alerting ────────────────────────────────────────
# Solo declara el receiver. Sin reglas en Grafana — las 5 reglas AIOps
# siguen en Prometheus/Alertmanager (fuente única).

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-contact-points
  namespace: arturo-monitoring
data:
  contact-points.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: aiops-agent-webhook
        receivers:
          - uid: aiops-webhook-uid-1
            type: webhook
            settings:
              url: http://agent-svc.arturo-llm-test.svc.cluster.local:8000/webhook/alert
              httpMethod: POST
            disableResolveMessage: false

---

# ── Deployment Grafana ────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: arturo-monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard-aiops
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: contact-points
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-aiops
          configMap:
            name: grafana-dashboard-aiops
        - name: contact-points
          configMap:
            name: grafana-contact-points

---

# ── Service Grafana ───────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: arturo-monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
