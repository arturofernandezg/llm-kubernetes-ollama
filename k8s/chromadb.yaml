apiVersion: v1
kind: ConfigMap
metadata:
  name: chroma-log-config
  namespace: arturo-llm-test
  labels:
    app: chromadb
data:
  log_config.yml: |
    version: 1
    disable_existing_loggers: false
    formatters:
      default:
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
        datefmt: "%Y-%m-%d %H:%M:%S"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: default
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
        - console
    loggers:
      chromadb:
        level: INFO
        handlers:
          - console
        propagate: false
      uvicorn:
        level: INFO
        handlers:
          - console
        propagate: false
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb-svc
  namespace: arturo-llm-test
  labels:
    app: chromadb
spec:
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: chromadb
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: arturo-llm-test
  labels:
    app: chromadb
spec:
  serviceName: "chromadb-svc"
  replicas: 1 # Única réplica embebida (Suficiente para Fase 2)
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      nodeSelector:
        guaranteed: "true"
      # Las bases de datos no recomiendan ejecutarse como ROOT
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      tolerations:
        # GCP Spot Toleration — dead code con nodeSelector guaranteed, se mantiene como safety net
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "guaranteed"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: chromadb
          image: chromadb/chroma:0.6.3
          ports:
            - containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: "/var/lib/chroma"
            - name: ANONYMIZED_TELEMETRY
              value: "False"
          volumeMounts:
            - name: chromadb-data
              mountPath: /var/lib/chroma
            # Sobreescribe log_config.yml para redirigir a stdout y evitar PermissionError en /chroma/chroma.log
            - name: log-config
              mountPath: /chroma/chromadb/log_config.yml
              subPath: log_config.yml
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi" # RAM garantizada
            limits:
              cpu: "1000m" # Evita canibalizar el resto del nodo e2-standard-2
              memory: "2Gi" # Hard limit para evitar OOMKillers del sistema principal
      volumes:
        - name: log-config
          configMap:
            name: chroma-log-config
  # Plantilla de disco. GCP inyectará su GCE Persistent Disk dinámicamente
  volumeClaimTemplates:
    - metadata:
        name: chromadb-data
      spec:
        accessModes: [ "ReadWriteOnce" ] # El disco solo se enchufa a 1 nodo a la vez
        resources:
          requests:
            storage: 10Gi
