apiVersion: v1
kind: Namespace
metadata:
  name: arturo-chaos
  labels:
    managed-by: aiops-agent
    project: uniovi-ai-infra-agent
    environment: chaos
    created-by: arturofernandezg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-oom-target
  namespace: arturo-chaos
  labels:
    managed-by: aiops-agent
    project: uniovi-ai-infra-agent
    environment: chaos
    created-by: arturofernandezg
    chaos-type: oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-oom-target
  template:
    metadata:
      labels:
        app: chaos-oom-target
        chaos-type: oom
    spec:
      nodeSelector:
        guaranteed: "true"
      tolerations:
      - key: "guaranteed"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      # Mirror obligatorio antes de aplicar:
      # crane copy --platform linux/amd64 polinux/stress:latest \
      #   europe-southwest1-docker.pkg.dev/uniovi-ai-infra-agent/aiops-agent/polinux-stress:latest
      containers:
      - name: stress
        image: europe-southwest1-docker.pkg.dev/uniovi-ai-infra-agent/aiops-agent/polinux-stress:latest
        imagePullPolicy: Always
        command: ["stress"]
        # No --timeout: stress runs forever so restarts only ever mean OOM.
        # With a timeout, once a fix raises the limit above 100M, stress would
        # exit(0) at the deadline and restart cleanly — benign restarts the
        # rollback health-check misreads as crashes (false rollback). Infinite
        # stress => healthy fix = 0 restarts = cured; failing fix = OOM = revert.
        #
        # --vm-hang 0: allocate+dirty the 100M once, then sleep forever holding it
        # (stress(1): 0 = hang indefinitely). At 32Mi the allocation still blows
        # the limit => OOM as before; but a CURED target (512Mi) sits resident at
        # ~0 CPU instead of spinning malloc/free — a forgotten cured run no longer
        # burns a node overnight nor floods HighCPU ("horno nocturno", 2026-07-06).
        # Cured-side behaviour pending first in-cluster validation.
        args: ["--vm", "1", "--vm-bytes", "100M", "--vm-hang", "0"]
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      restartPolicy: Always
